# Local development stack. Phase 0 runs only PostgreSQL; api, orchestrator, web,
# egress-proxy and docker-socket-proxy services are added in later phases.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD
#   pnpm db:up
name: evolvesales-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolvesales}
      POSTGRES_USER: ${POSTGRES_USER:-evolvesales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only — never exposed on the LAN.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
